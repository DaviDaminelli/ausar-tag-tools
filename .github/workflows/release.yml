name: Linux zip

# The Windows zip is built and published locally (`dist/release.ps1`,
# decisions D65). This adds the Linux zip to an existing release, when
# someone needs it: Actions → Linux zip → Run workflow, with the tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the version in Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "v$version" != "${{ inputs.tag }}" ]; then
            echo "::error::tag ${{ inputs.tag }} doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Unit tests only: tests against real game files are #[ignore]d.
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --bin ausar-tag-cli --bin ausar-tag-mcp
      - name: Package and add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ausar-tag-tools-$VERSION-linux"
          mkdir "$name"
          cp target/release/ausar-tag-cli target/release/ausar-tag-mcp README.md docs/SETUP.md dist/h5tags.example.toml "$name/"
          zip -rq "$name.zip" "$name"
          gh release upload "${{ inputs.tag }}" "$name.zip" --repo "$GITHUB_REPOSITORY"
