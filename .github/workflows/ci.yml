name: CI

# Started by hand (Actions → CI → Run workflow), to save the free plan's
# minutes: the same checks run locally before every commit (decisions D65).
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS left out for now (decisions D63).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Unit tests only: tests against real game files are #[ignore]d (no game files in CI).
      - run: cargo test --workspace
