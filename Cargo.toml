[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
h5-module = { path = "crates/h5-module" }
h5-defs = { path = "crates/h5-defs" }
h5tags-core = { path = "crates/h5tags-core" }

clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
memmap2 = "0.9"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
quick-xml = "0.42"
regex = "1.13"
anstyle = "1"
anstream = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Decompressing large modules in debug builds (tests) is slow without this.
[profile.dev.package."*"]
opt-level = 3
