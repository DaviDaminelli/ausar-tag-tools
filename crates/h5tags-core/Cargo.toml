[package]
name = "h5tags-core"
description = "Config, builds and the tools shared by the h5tags CLI and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# A test deploy folder (synthetic modules) for other crates' tests.
testutil = ["h5-module/testutil"]

[dependencies]
h5-defs.workspace = true
h5-meta.workspace = true
h5-module.workspace = true
anstyle.workspace = true
clap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
lru.workspace = true
schemars.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
h5-module = { workspace = true, features = ["testutil"] }
anstream.workspace = true
